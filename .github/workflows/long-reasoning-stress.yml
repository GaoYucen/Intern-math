name: long-reasoning-stress

on:
  push:
    branches: [long-reasoning-calibration]
    paths:
      - ".github/workflows/long-reasoning-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: b0_off_4k
            thinking: "0"
            max_tokens: "4096"
          - config: think_on_8k
            thinking: "1"
            max_tokens: "8192"
          - config: think_on_16k
            thinking: "1"
            max_tokens: "16384"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview
      AGENT_MODE: direct
      INTERN_THINKING_MODE: ${{ matrix.thinking }}
      AGENT_MAX_TOKENS: ${{ matrix.max_tokens }}
      AGENT_TEMPERATURE: "0.15"
      LOCAL_MAX_CONCURRENCY: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: pytest -q

      - name: Verify API key
        run: test -n "$INTERN_API_KEY"

      - name: Build 40-item trusted stress set
        run: python scripts/build_long_reasoning_stress.py

      - name: Record configuration
        run: |
          mkdir -p reports/long_reasoning/${{ matrix.config }}
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("reports/long_reasoning/${{ matrix.config }}/config.json")
          p.write_text(json.dumps({
              "config": "${{ matrix.config }}",
              "commit": os.environ.get("GITHUB_SHA"),
              "model": os.environ.get("INTERN_MODEL"),
              "thinking": os.environ.get("INTERN_THINKING_MODE"),
              "max_tokens": os.environ.get("AGENT_MAX_TOKENS"),
              "temperature": os.environ.get("AGENT_TEMPERATURE"),
              "mode": os.environ.get("AGENT_MODE"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run stress set
        run: |
          rm -rf outputs/long_reasoning/${{ matrix.config }}
          python main.py \
            --input_file data/long_reasoning_stress/input.jsonl \
            --output_dir outputs/long_reasoning/${{ matrix.config }}

      - name: Strict evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/long_reasoning_stress/gold.jsonl \
            --output_dir outputs/long_reasoning/${{ matrix.config }} \
            --report_dir reports/long_reasoning/${{ matrix.config }} || true

      - name: Reference-based adjudication
        if: always()
        run: |
          python scripts/adjudicate_results.py \
            --benchmark data/long_reasoning_stress/gold.jsonl \
            --output_dir outputs/long_reasoning/${{ matrix.config }} \
            --report_dir reports/long_reasoning/${{ matrix.config }}/adjudicated \
            --judge-model intern-s1-pro \
            --fallback-model intern-s2-preview \
            --concurrency 2 || true

      - name: Output-length summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("outputs/long_reasoning/${{ matrix.config }}")
          lengths=[]; errors=0; final_markers=0
          for p in sorted(out.glob("*.json")):
              row=json.loads(p.read_text(encoding="utf-8"))
              if row.get("status") != "success":
                  errors += 1
                  continue
              text=row.get("final_response", "")
              lengths.append(len(text))
              if "FINAL_ANSWER:" in text.upper(): final_markers += 1
          summary={
              "n_success": len(lengths), "errors": errors,
              "mean_chars": sum(lengths)/len(lengths) if lengths else 0,
              "max_chars": max(lengths) if lengths else 0,
              "final_marker_count": final_markers,
          }
          path=Path("reports/long_reasoning/${{ matrix.config }}/output_lengths.json")
          path.write_text(json.dumps(summary, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-reasoning-${{ matrix.config }}-${{ github.run_id }}
          retention-days: 30
          path: |
            data/long_reasoning_stress/manifest.json
            outputs/long_reasoning/${{ matrix.config }}
            reports/long_reasoning/${{ matrix.config }}
