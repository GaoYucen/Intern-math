name: build-fresh-holdout-v1

on:
  push:
    branches: [benchmark-fresh-holdout-v1]
    paths:
      - "scripts/build_fresh_holdout_v1.py"
      - ".github/workflows/build-fresh-holdout-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and validate fresh holdout
        run: python scripts/build_fresh_holdout_v1.py
      - name: Commit frozen benchmark files
        run: |
          if git diff --quiet -- data/fresh_holdout_v1; then
            echo "Fresh holdout already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fresh_holdout_v1
          git commit -m "Generate Fresh-Holdout-v1 v0.1 [skip ci]"
          git push origin HEAD:benchmark-fresh-holdout-v1
