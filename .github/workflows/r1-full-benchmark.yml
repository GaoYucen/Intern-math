name: r1-full-benchmark

on:
  push:
    branches: [r1-robust-baseline]
    paths:
      - "experiments/r1_full_benchmark.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview-397b
      INTERN_THINKING_MODE: "1"
      AGENT_MAX_TOKENS: "8192"
      AGENT_TEMPERATURE: "0.0"
      LOCAL_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: pytest -q

      - name: Verify API key
        run: test -n "$INTERN_API_KEY"

      - name: Run 340-item R1 benchmark
        run: |
          rm -rf outputs/r1_full reports/r1_full
          python main.py \
            --input_file data/benchmark_v1/input.jsonl \
            --output_dir outputs/r1_full

      - name: Strict evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/benchmark_v1/gold.jsonl \
            --output_dir outputs/r1_full \
            --report_dir reports/r1_full || true

      - name: Delivery telemetry
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('outputs/r1_full')
          rows=[]
          for p in sorted(out.glob('*.json')):
              try: rows.append(json.loads(p.read_text(encoding='utf-8')))
              except Exception: pass
          successful=[r for r in rows if r.get('status')=='success']
          texts=[str(r.get('final_response','')) for r in successful]
          req=[]
          for r in successful:
              for t in r.get('trace',[]):
                  if t.get('step')=='r1_single_solver':
                      req.append(t.get('content',{}).get('request_count'))
          marker=[('FINAL_ANSWER:' in t.upper()) for t in texts]
          telemetry={
              'records':len(rows),
              'success':len(successful),
              'errors':len(rows)-len(successful),
              'final_marker_count':sum(marker),
              'final_marker_rate':sum(marker)/len(texts) if texts else 0,
              'nonempty_count':sum(bool(t.strip()) for t in texts),
              'mean_response_chars':sum(map(len,texts))/len(texts) if texts else 0,
              'max_response_chars':max(map(len,texts)) if texts else 0,
              'all_trace_request_counts_one':bool(req) and all(x==1 for x in req),
              'missing_marker_idx':[r.get('idx') for r,t in zip(successful,texts) if 'FINAL_ANSWER:' not in t.upper()],
          }
          Path('reports/r1_full').mkdir(parents=True,exist_ok=True)
          Path('reports/r1_full/delivery_telemetry.json').write_text(json.dumps(telemetry,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(telemetry,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-full-benchmark-${{ github.run_id }}
          retention-days: 30
          path: |
            outputs/r1_full
            reports/r1_full
