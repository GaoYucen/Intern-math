name: r1-long-reasoning-stress

on:
  push:
    branches: [r1-robust-baseline]
    paths:
      - "experiments/r1_long_stress.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview-397b
      INTERN_THINKING_MODE: "0"
      AGENT_MAX_TOKENS: "8192"
      AGENT_TEMPERATURE: "0.0"
      LOCAL_MAX_CONCURRENCY: "2"
      INTERN_CONNECT_TIMEOUT: "20"
      INTERN_READ_TIMEOUT: "360"
      INTERN_TRANSPORT_ATTEMPTS: "2"
      INTERN_RETRY_BACKOFF_MIN: "2"
      INTERN_RETRY_BACKOFF_MAX: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        env:
          INTERN_THINKING_MODE: "1"
        run: pytest -q

      - name: Verify API key
        run: test -n "$INTERN_API_KEY"

      - name: Build 40-item trusted stress set
        run: python scripts/build_long_reasoning_stress.py

      - name: Run R1 stress set
        run: |
          rm -rf outputs/r1_long_stress reports/r1_long_stress
          python main.py \
            --input_file data/long_reasoning_stress/input.jsonl \
            --output_dir outputs/r1_long_stress

      - name: Strict evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/long_reasoning_stress/gold.jsonl \
            --output_dir outputs/r1_long_stress \
            --report_dir reports/r1_long_stress || true

      - name: Delivery telemetry
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for p in sorted(Path('outputs/r1_long_stress').glob('*.json')):
              try:
                  rows.append(json.loads(p.read_text(encoding='utf-8')))
              except Exception:
                  pass
          successful=[r for r in rows if r.get('status') == 'success']
          texts=[str(r.get('final_response','')) for r in successful]
          marker=[('FINAL_ANSWER:' in t.upper()) for t in texts]

          solver=[]
          for r in rows:
              for t in r.get('trace',[]):
                  if t.get('step') == 'r1_single_solver':
                      solver.append((r.get('idx'), t.get('content',{})))
                      break
          semantic_counts=[c.get('request_count') for _,c in solver]
          http_attempt_counts=[c.get('http_attempt_count',1) for _,c in solver]
          retried_idx=[idx for (idx,_),n in zip(solver,http_attempt_counts) if isinstance(n,int) and n>1]
          terminal_errors=[]
          total_latencies=[]
          finish_reasons=[]
          completion_tokens=[]
          for idx,c in solver:
              meta=c.get('client_telemetry',{})
              if meta.get('terminal_error_type'):
                  terminal_errors.append({'idx':idx,'type':meta.get('terminal_error_type')})
              if isinstance(meta.get('total_latency_seconds'),(int,float)):
                  total_latencies.append(meta['total_latency_seconds'])
              if meta.get('finish_reason') is not None:
                  finish_reasons.append(meta.get('finish_reason'))
              usage=meta.get('usage') or {}
              if isinstance(usage.get('completion_tokens'),int):
                  completion_tokens.append(usage['completion_tokens'])

          telemetry={
              'records':len(rows),
              'success':len(successful),
              'errors':len(rows)-len(successful),
              'final_marker_count':sum(marker),
              'final_marker_rate':sum(marker)/len(texts) if texts else 0,
              'nonempty_count':sum(bool(t.strip()) for t in texts),
              'mean_response_chars':sum(map(len,texts))/len(texts) if texts else 0,
              'median_response_chars':sorted(map(len,texts))[len(texts)//2] if texts else 0,
              'max_response_chars':max(map(len,texts)) if texts else 0,
              'semantic_request_counts':semantic_counts,
              'all_semantic_request_counts_one':bool(semantic_counts) and all(x==1 for x in semantic_counts),
              'http_attempt_counts':http_attempt_counts,
              'http_attempt_total':sum(x for x in http_attempt_counts if isinstance(x,int)),
              'transport_retry_total':sum(max(0,x-1) for x in http_attempt_counts if isinstance(x,int)),
              'retried_idx':retried_idx,
              'terminal_errors':terminal_errors,
              'finish_reasons':finish_reasons,
              'length_finish_count':sum(x=='length' for x in finish_reasons),
              'stop_finish_count':sum(x=='stop' for x in finish_reasons),
              'mean_total_latency_seconds':sum(total_latencies)/len(total_latencies) if total_latencies else None,
              'max_total_latency_seconds':max(total_latencies) if total_latencies else None,
              'mean_completion_tokens':sum(completion_tokens)/len(completion_tokens) if completion_tokens else None,
              'max_completion_tokens':max(completion_tokens) if completion_tokens else None,
              'missing_marker_idx':[r.get('idx') for r,t in zip(successful,texts) if 'FINAL_ANSWER:' not in t.upper()],
          }
          Path('reports/r1_long_stress').mkdir(parents=True, exist_ok=True)
          Path('reports/r1_long_stress/delivery_telemetry.json').write_text(json.dumps(telemetry,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(telemetry,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-long-reasoning-stress-${{ github.run_id }}
          retention-days: 30
          path: |
            data/long_reasoning_stress/manifest.json
            data/long_reasoning_stress/gold.jsonl
            outputs/r1_long_stress
            reports/r1_long_stress
