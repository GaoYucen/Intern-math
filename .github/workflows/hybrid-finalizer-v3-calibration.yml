name: hybrid-finalizer-v3-calibration

# H4/H6 bounded-thinking + non-destructive finalizer ablation.
on:
  push:
    branches: [hybrid-finalizer-v3]
    paths:
      - ".github/workflows/hybrid-finalizer-v3-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: h4-direct
            mode: direct_a
            solver_tokens: "4096"
          - name: h4-hybrid
            mode: hybrid
            solver_tokens: "4096"
          - name: h6-direct
            mode: direct_a
            solver_tokens: "6144"
          - name: h6-hybrid
            mode: hybrid
            solver_tokens: "6144"
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview-397b
      AGENT_MODE: ${{ matrix.mode }}
      AGENT_SOLVER_A_THINKING: "1"
      AGENT_SOLVER_B_THINKING: "0"
      AGENT_CHOOSER_THINKING: "0"
      AGENT_SOLVER_TOKENS: ${{ matrix.solver_tokens }}
      AGENT_CHOOSER_TOKENS: "2048"
      AGENT_FINALIZER_TOKENS: "1536"
      AGENT_SOLVER_A_TEMPERATURE: "0.15"
      AGENT_SOLVER_B_TEMPERATURE: "0.35"
      AGENT_CHOOSER_TEMPERATURE: "0.0"
      AGENT_FINALIZER_TEMPERATURE: "0.0"
      LOCAL_MAX_CONCURRENCY: "2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        run: pytest -q
      - name: Verify API key
        run: test -n "$INTERN_API_KEY"
      - name: Import frozen Fresh-Holdout-v1 dev split
        run: |
          git fetch origin benchmark-fresh-holdout-v1 --depth=1
          mkdir -p data/fresh_holdout_dev
          git show FETCH_HEAD:data/fresh_holdout_v1/input.jsonl > /tmp/fresh_input.jsonl
          git show FETCH_HEAD:data/fresh_holdout_v1/gold.jsonl > /tmp/fresh_gold.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          for src, dst in [('/tmp/fresh_input.jsonl','data/fresh_holdout_dev/input.jsonl'),('/tmp/fresh_gold.jsonl','data/fresh_holdout_dev/gold.jsonl')]:
              rows=[json.loads(x) for x in Path(src).read_text(encoding='utf-8').splitlines() if x.strip()]
              rows=[r for r in rows if int(r['idx']) < 22]
              Path(dst).write_text(''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in rows),encoding='utf-8')
              print(dst, len(rows))
          PY
      - name: Run ${{ matrix.name }}
        run: |
          rm -rf outputs/hybrid_v3/${{ matrix.name }}
          python main.py \
            --input_file data/fresh_holdout_dev/input.jsonl \
            --output_dir outputs/hybrid_v3/${{ matrix.name }}
      - name: Strict objective evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/fresh_holdout_dev/gold.jsonl \
            --output_dir outputs/hybrid_v3/${{ matrix.name }} \
            --report_dir reports/hybrid_v3/${{ matrix.name }} || true
      - name: Hybrid trace summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('outputs/hybrid_v3/${{ matrix.name }}')
          s={
              'records':0,'success':0,'error':0,'final_marker':0,'final_closed':0,
              'primary_closed':0,'primary_unclosed':0,'finalizer_called':0,
              'finalizer_closed':0,'finalizer_failed':0,
          }
          for p in out.glob('*.json'):
              r=json.loads(p.read_text(encoding='utf-8')); s['records']+=1
              if r.get('status')!='success':
                  s['error']+=1; continue
              s['success']+=1
              if 'FINAL_ANSWER:' in r.get('final_response','').upper(): s['final_marker']+=1
              trace=r.get('trace',[])
              solver=next((t for t in trace if t.get('step')=='solver_a'),None)
              if solver:
                  if solver.get('content',{}).get('has_closed_answer'): s['primary_closed']+=1
                  else: s['primary_unclosed']+=1
              finalizer=next((t for t in trace if t.get('step')=='finalizer'),None)
              if finalizer: s['finalizer_called']+=1
              for t in trace:
                  if t.get('step')=='closure_gate':
                      status=t.get('content',{}).get('status')
                      if status=='finalizer_closed': s['finalizer_closed']+=1
                      elif status=='finalizer_failed': s['finalizer_failed']+=1
              if trace and any(
                  t.get('content',{}).get('has_closed_answer')
                  for t in trace if t.get('step') in {'solver_a','finalizer'}
              ):
                  s['final_closed']+=1
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-v3-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 30
          path: |
            outputs/hybrid_v3/${{ matrix.name }}
            reports/hybrid_v3/${{ matrix.name }}
