name: adaptive-v1-full

on:
  push:
    branches: [adaptive-v1]
    paths:
      - "user_agent.py"
      - "tests/**"
      - ".github/workflows/adaptive-v1-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview
      LOCAL_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Verify API key
        run: test -n "$INTERN_API_KEY"

      - name: Public-sample smoke test
        run: |
          rm -rf tmp/adaptive_sample outputs/adaptive_sample
          mkdir -p tmp/adaptive_sample outputs/adaptive_sample
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [
              {"idx": 0, "problem": "设$\\mathbb{F}_{81}$为$81$元的有限域。$T=\\{\\alpha\\in\\mathbb{F}_{81}|\\mathbb{F}_{81}=\\mathbb{F}_3(\\alpha)\\}$。求$T$中元素的个数。"},
              {"idx": 1, "problem": "Let $f_{\\text{inv}} : \\mathbb{R} \\to \\mathbb{R}$ be the inverse function of $f(x) = x^7 + x^5 + 3$. Put $F(x)=\\int_x^{-17} f_{\\text{inv}}(t)dt$. Find the numerical value of $F'(5)$."},
              {"idx": 2, "problem": "设函数 $ f(z) = \\frac{1}{(z-1)(z-2)^2(z-3)^3} $，其中 $ z $ 为复变量。求 $ f(z) $ 在简单极点 $ z = 1 $ 处的留数。"},
          ]
          p = Path("tmp/adaptive_sample/input.jsonl")
          with p.open("w", encoding="utf-8") as f:
              for row in rows:
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")
          PY
          python main.py \
            --input_file tmp/adaptive_sample/input.jsonl \
            --output_dir outputs/adaptive_sample
          python - <<'PY'
          import json
          from pathlib import Path
          for idx in range(3):
              r = json.loads((Path("outputs/adaptive_sample") / f"{idx}.json").read_text(encoding="utf-8"))
              assert r.get("status") == "success", (idx, r)
              assert str(r.get("final_response", "")).strip(), idx
          print("Adaptive public-sample smoke passed.")
          PY

      - name: Record experiment metadata
        run: |
          mkdir -p reports/adaptive
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('data/benchmark_v1/manifest.json').read_text(encoding='utf-8'))
          meta = {
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "model": os.environ.get("INTERN_MODEL"),
              "agent_mode": "adaptive_verify",
              "thinking_mode": False,
              "first_temperature": 0.15,
              "second_temperature": 0.0,
              "verifier_temperature": 0.0,
              "max_tokens": 4096,
              "concurrency": os.environ.get("LOCAL_MAX_CONCURRENCY"),
              "benchmark": "data/benchmark_v1/input.jsonl",
              "benchmark_input_sha256": manifest.get("input_sha256"),
              "benchmark_gold_sha256": manifest.get("gold_sha256"),
              "n_rows": manifest.get("n_rows"),
          }
          Path('reports/adaptive/run_metadata.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          PY

      - name: Run 340-item adaptive benchmark
        run: |
          rm -rf outputs/adaptive
          python main.py \
            --input_file data/benchmark_v1/input.jsonl \
            --output_dir outputs/adaptive

      - name: Summarize adaptive routing
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          routes = Counter()
          call_counts = Counter()
          agreement = Counter()
          success = 0
          for p in sorted(Path('outputs/adaptive').glob('*.json')):
              r = json.loads(p.read_text(encoding='utf-8'))
              if r.get('status') != 'success':
                  continue
              success += 1
              for step in r.get('trace', []):
                  if step.get('step') == 'adaptive_router':
                      c = step.get('content', {})
                      routes[c.get('route', 'unknown')] += 1
                      call_counts[str(c.get('model_calls', 'unknown'))] += 1
                  elif step.get('step') == 'agreement_check':
                      agreement[str(step.get('content', {}).get('agree'))] += 1
          out = {
              'successful_items': success,
              'routes': dict(routes),
              'model_calls_per_item': dict(call_counts),
              'agreement_check': dict(agreement),
          }
          Path('reports/adaptive/route_summary.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          PY

      - name: Strict evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/benchmark_v1/gold.jsonl \
            --output_dir outputs/adaptive \
            --report_dir reports/adaptive/strict || true

      - name: Reference-based adjudication
        if: always()
        run: |
          python scripts/adjudicate_results.py \
            --benchmark data/benchmark_v1/gold.jsonl \
            --output_dir outputs/adaptive \
            --report_dir reports/adaptive/adjudicated \
            --judge-model intern-s1-pro \
            --fallback-model intern-s2-preview \
            --concurrency 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-v1-340-${{ github.run_id }}
          retention-days: 30
          path: |
            outputs/adaptive
            reports/adaptive
