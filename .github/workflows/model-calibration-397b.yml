name: model-calibration-397b

on:
  push:
    branches: [model-calibration-397b]
    paths:
      - ".github/workflows/model-calibration-397b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: 397b_conservative_8k
            model: intern-s2-preview-397b
            temperature: "0.15"
            top_p: ""
            top_k: ""
          - config: 397b_recommended_8k
            model: intern-s2-preview-397b
            temperature: "0.8"
            top_p: "0.95"
            top_k: "50"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: ${{ matrix.model }}
      AGENT_MODE: direct
      INTERN_THINKING_MODE: "1"
      AGENT_MAX_TOKENS: "8192"
      AGENT_TEMPERATURE: ${{ matrix.temperature }}
      AGENT_TOP_P: ${{ matrix.top_p }}
      AGENT_TOP_K: ${{ matrix.top_k }}
      LOCAL_MAX_CONCURRENCY: "2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: pytest -q

      - name: Verify API key
        run: test -n "$INTERN_API_KEY"

      - name: Smoke-test selected model id
        run: |
          python - <<'PY'
          from llm_client import InternChatClient
          client = InternChatClient(timeout=180, retry=2)
          out = client.chat(
              [{"role":"user","content":"Return exactly OK."}],
              temperature=0.0,
              max_tokens=64,
              thinking_mode=False,
          )
          print("model=", client.model)
          print("smoke_nonempty=", bool(str(out).strip()))
          if not str(out).strip():
              raise SystemExit("empty model smoke response")
          PY

      - name: Build 40-item trusted stress set
        run: python scripts/build_long_reasoning_stress.py

      - name: Record configuration
        run: |
          mkdir -p reports/model397/${{ matrix.config }}
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("reports/model397/${{ matrix.config }}/config.json")
          p.write_text(json.dumps({
              "config": "${{ matrix.config }}",
              "commit": os.environ.get("GITHUB_SHA"),
              "model": os.environ.get("INTERN_MODEL"),
              "thinking": os.environ.get("INTERN_THINKING_MODE"),
              "max_tokens": os.environ.get("AGENT_MAX_TOKENS"),
              "temperature": os.environ.get("AGENT_TEMPERATURE"),
              "top_p": os.environ.get("AGENT_TOP_P"),
              "top_k": os.environ.get("AGENT_TOP_K"),
              "mode": os.environ.get("AGENT_MODE"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run 40-item stress set
        run: |
          rm -rf outputs/model397/${{ matrix.config }}
          python main.py \
            --input_file data/long_reasoning_stress/input.jsonl \
            --output_dir outputs/model397/${{ matrix.config }}

      - name: Strict evaluation
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/long_reasoning_stress/gold.jsonl \
            --output_dir outputs/model397/${{ matrix.config }} \
            --report_dir reports/model397/${{ matrix.config }} || true

      - name: Reference-based adjudication
        if: always()
        run: |
          python scripts/adjudicate_results.py \
            --benchmark data/long_reasoning_stress/gold.jsonl \
            --output_dir outputs/model397/${{ matrix.config }} \
            --report_dir reports/model397/${{ matrix.config }}/adjudicated \
            --judge-model intern-s1-pro \
            --fallback-model intern-s2-preview \
            --concurrency 2 || true

      - name: Output summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("outputs/model397/${{ matrix.config }}")
          lengths=[]; errors=0; final_markers=0
          for p in sorted(out.glob("*.json")):
              row=json.loads(p.read_text(encoding="utf-8"))
              if row.get("status") != "success":
                  errors += 1
                  continue
              text=row.get("final_response", "")
              lengths.append(len(text))
              if "FINAL_ANSWER:" in text.upper():
                  final_markers += 1
          summary={
              "n_success": len(lengths),
              "errors": errors,
              "mean_chars": sum(lengths)/len(lengths) if lengths else 0,
              "max_chars": max(lengths) if lengths else 0,
              "final_marker_count": final_markers,
          }
          path=Path("reports/model397/${{ matrix.config }}/output_lengths.json")
          path.write_text(json.dumps(summary, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model397-${{ matrix.config }}-${{ github.run_id }}
          retention-days: 30
          path: |
            data/long_reasoning_stress/manifest.json
            outputs/model397/${{ matrix.config }}
            reports/model397/${{ matrix.config }}
