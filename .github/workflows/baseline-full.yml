name: baseline-full

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseline-full.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Intern model id"
        required: false
        default: "intern-s2-preview"
      mode:
        description: "Agent mode: direct or self_refine"
        required: false
        default: "direct"
      thinking:
        description: "Thinking mode: 0 or 1"
        required: false
        default: "0"
      max_tokens:
        description: "Maximum completion tokens"
        required: false
        default: "4096"
      concurrency:
        description: "Local API concurrency"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: ${{ github.event.inputs.model || 'intern-s2-preview' }}
      AGENT_MODE: ${{ github.event.inputs.mode || 'direct' }}
      INTERN_THINKING_MODE: ${{ github.event.inputs.thinking || '0' }}
      AGENT_MAX_TOKENS: ${{ github.event.inputs.max_tokens || '4096' }}
      LOCAL_MAX_CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest -q
      - name: Verify API key is configured
        run: |
          if [ -z "$INTERN_API_KEY" ]; then
            echo "INTERN_API_KEY repository secret is not configured."
            exit 2
          fi
      - name: Record run metadata
        run: |
          mkdir -p reports/full
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('data/benchmark_v1/manifest.json').read_text(encoding='utf-8'))
          meta = {
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "model": os.environ.get("INTERN_MODEL"),
              "agent_mode": os.environ.get("AGENT_MODE"),
              "thinking_mode": os.environ.get("INTERN_THINKING_MODE"),
              "max_tokens": os.environ.get("AGENT_MAX_TOKENS"),
              "concurrency": os.environ.get("LOCAL_MAX_CONCURRENCY"),
              "benchmark": "data/benchmark_v1/input.jsonl",
              "benchmark_input_sha256": manifest.get("input_sha256"),
              "benchmark_gold_sha256": manifest.get("gold_sha256"),
              "n_rows": manifest.get("n_rows"),
          }
          Path('reports/full/run_metadata.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          PY
      - name: Run Benchmark-v1
        run: |
          rm -rf outputs/full
          python main.py \
            --input_file data/benchmark_v1/input.jsonl \
            --output_dir outputs/full
      - name: Evaluate Benchmark-v1
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark data/benchmark_v1/gold.jsonl \
            --output_dir outputs/full \
            --report_dir reports/full || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-v1-${{ github.event.inputs.model || 'intern-s2-preview' }}-${{ github.event.inputs.mode || 'direct' }}-thinking-${{ github.event.inputs.thinking || '0' }}-${{ github.run_id }}
          retention-days: 30
          path: |
            outputs/full
            reports/full
