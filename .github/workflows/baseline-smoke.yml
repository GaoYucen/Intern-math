name: baseline-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Intern model id"
        required: false
        default: "intern-s2-preview"
      mode:
        description: "Agent mode: direct or self_refine"
        required: false
        default: "direct"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        thinking: ["0", "1"]
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: ${{ github.event.inputs.model || 'intern-s2-preview' }}
      AGENT_MODE: ${{ github.event.inputs.mode || 'direct' }}
      INTERN_THINKING_MODE: ${{ matrix.thinking }}
      AGENT_MAX_TOKENS: "4096"
      LOCAL_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest -q
      - name: Verify API key is configured
        run: |
          if [ -z "$INTERN_API_KEY" ]; then
            echo "INTERN_API_KEY repository secret is not configured."
            exit 2
          fi
      - name: Build true 17-domain representative smoke subset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          input_rows = [json.loads(x) for x in Path('data/benchmark_v1/input.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          gold_rows = [json.loads(x) for x in Path('data/benchmark_v1/gold.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(input_rows) == len(gold_rows) == 340
          input_by_idx = {row['idx']: row for row in input_rows}

          selected_by_domain = {}
          review_types = {'proof', 'explanation', 'derivation'}
          for row in gold_rows:
              domain = row.get('domain', 'unknown')
              if domain not in selected_by_domain and row.get('answer_type', 'text') not in review_types:
                  selected_by_domain[domain] = row
          for row in gold_rows:
              domain = row.get('domain', 'unknown')
              selected_by_domain.setdefault(domain, row)

          selected_gold = [selected_by_domain[d] for d in sorted(selected_by_domain)]
          assert len(selected_gold) == 17, (len(selected_gold), sorted(selected_by_domain))
          assert len({r['domain'] for r in selected_gold}) == 17

          Path('tmp').mkdir(exist_ok=True)
          with Path('tmp/smoke_input.jsonl').open('w', encoding='utf-8') as f_in, Path('tmp/smoke_gold.jsonl').open('w', encoding='utf-8') as f_gold:
              for gold in selected_gold:
                  f_in.write(json.dumps(input_by_idx[gold['idx']], ensure_ascii=False) + '\n')
                  f_gold.write(json.dumps(gold, ensure_ascii=False) + '\n')

          print('selected idx:', [r['idx'] for r in selected_gold])
          print('domains:', [r['domain'] for r in selected_gold])
          print('answer types:', [r.get('answer_type') for r in selected_gold])
          PY
      - name: Run direct baseline smoke
        run: |
          rm -rf outputs/smoke reports/smoke
          python main.py --input_file tmp/smoke_input.jsonl --output_dir outputs/smoke
      - name: Evaluate smoke outputs
        if: always()
        run: |
          python scripts/evaluate_outputs.py \
            --benchmark tmp/smoke_gold.jsonl \
            --output_dir outputs/smoke \
            --report_dir reports/smoke || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-smoke-thinking-${{ matrix.thinking }}-${{ github.run_id }}
          retention-days: 30
          path: |
            tmp/smoke_input.jsonl
            tmp/smoke_gold.jsonl
            outputs/smoke
            reports/smoke
